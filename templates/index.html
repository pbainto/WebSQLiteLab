<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Database</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">

        <h1>Student Database</h1>

        <a href="/add" class="btn">Add Student</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
<th>Name</th>
<th>Course</th>
<th>Year Level</th>
<th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student[0] }}</td>
<td>{{ student[1] }}</td>
<td>{{ student[2] }}</td>
<td>{{ student[3] }}</td>
<td>
    <a href="/edit/{{ student[0] }}" class="btn">Edit</a>
    <a href="/delete/{{ student[0] }}"
   class="btn"
   onclick="return confirm('Are you sure you want to delete this student?');">
    Delete
</a>
</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</body>
</html>
